<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>서버 자료 보기 · 과학 플랫폼 테스트</title>
  <script src="./platform-config.js"></script>
  <link rel="stylesheet" href="./assets/content-manager.css">
  <style>html,body{margin:0;min-height:100%;background:#0a1728;color:#e2e8f0;font-family:system-ui,sans-serif}header{padding:18px 24px;border-bottom:1px solid #304b63;display:flex;align-items:center;gap:16px;flex-wrap:wrap}header h1{font-size:1.1rem;margin:0;flex:1}header a{color:#bde8fa;text-decoration:none}main{padding:20px;max-width:1400px;margin:auto}#contentStatus{line-height:1.8;color:#bbd1e3}#contentStatus[data-error=true]{color:#fda4af}#contentFrame{display:block;width:100%;height:calc(100vh - 170px);min-height:450px;border:1px solid #38536d;border-radius:12px;background:white}#contentFrame[hidden],#openPdf[hidden]{display:none}</style>
</head>
<body>
  <header><a href="./index.html">← 자료실로</a><h1 id="contentTitle">자료 확인 중</h1><button id="contentRetry" class="scm-button" type="button">다시 확인</button><a id="openPdf" class="scm-button" target="_blank" rel="noopener noreferrer" hidden>PDF 새 창 열기</a></header>
  <main><p id="contentStatus" role="status" aria-live="polite">현재 세션과 자료 공개 상태를 서버에서 확인합니다.</p><iframe id="contentFrame" title="수업자료" referrerpolicy="no-referrer" hidden></iframe></main>
  <script src="./assets/content-client.js"></script>
  <script src="./assets/content-viewer.js"></script>
</body>
</html>
