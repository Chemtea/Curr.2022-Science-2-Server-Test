        if (settled) return;
        settled = true; clearTimeout(timer); session.waiters.delete(cancel);
        img.removeEventListener('load', onLoad); img.removeEventListener('error', onError);
        if (error) reject(error);
        else if (!worksheetPrintCurrent(session)) reject(worksheetPrintCancelled());
        else resolve();
      };
      const onLoad = () => done();
      const onError = () => done(new Error('worksheet-print-image'));
      const cancel = () => done(worksheetPrintCancelled());
      const timer = setTimeout(() => done(new Error('worksheet-print-image-timeout')), 20000);
      session.waiters.add(cancel);
      img.addEventListener('load', onLoad); img.addEventListener('error', onError);
      img.src = url;
      if (img.complete && img.naturalWidth > 0) done();
    });
  }

  async function printWorksheet() {
    if (!live() || !pdf || loading || rendering || !worksheetAllowed()) {
      status('학습지를 연 뒤 인쇄해 주세요. 잠긴 학습지는 인쇄할 수 없습니다.');
      return;
    }
    finishStroke();
    cancelWorksheetPrint();
    // Keep this synchronous with the click so ordinary popup controls allow it.
    let preview;
    try { preview = window.open('', '_blank', 'popup,width=900,height=900'); } catch {}
    if (!preview) { status('인쇄 미리보기 창이 차단되었습니다. 이 사이트의 팝업을 허용한 뒤 다시 눌러 주세요.'); return; }
    try { preview.opener = null; } catch {}
    const session = {
      preview, version:worksheetPrintVersion, documentPDF:pdf,
      urls:new Set(), canvases:new Set(), waiters:new Set(),
      task:null, closeWatch:null, ready:false, printPermit:false
    };
    worksheetPrintSession = session;
    const snapshot = JSON.parse(JSON.stringify(notes));
    const doc = preview.document;
    const make = (tag, className, text) => {
      const node = doc.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    };
    doc.documentElement.lang = 'ko';
    const printTitle = ($('title').textContent || '학습지') + ' · 필기 포함 인쇄';
    doc.head.replaceChildren(); doc.body.replaceChildren();
    const charset = doc.createElement('meta'); charset.setAttribute('charset', 'utf-8');
    const viewport = doc.createElement('meta'); viewport.name = 'viewport'; viewport.content = 'width=device-width, initial-scale=1';
    const css = make('style', '', `
      * { box-sizing:border-box; }
      body { margin:0; color:#172033; background:#e8edf3; font:15px/1.5 system-ui,sans-serif; }
      .ctwp-toolbar { position:sticky; top:0; z-index:2; display:flex; align-items:center; gap:12px; flex-wrap:wrap;
        padding:14px 20px; background:#fff; border-bottom:1px solid #cbd5e1; }
      .ctwp-toolbar strong { flex:1 1 240px; }
      button { padding:10px 16px; border:0; border-radius:8px; font:inherit; font-weight:700; cursor:pointer;
        color:#fff; background:#2563eb; }
      button:disabled { opacity:.45; cursor:wait; }
      .ctwp-close { background:#475569; }
      .ctwp-status { width:100%; margin:0; color:#475569; font-size:13px; }
      .ctwp-pages { padding:20px; }
      .ctwp-page { display:flex; justify-content:center; margin:0 auto 20px; max-width:850px; background:white;
        box-shadow:0 2px 10px #17203322; }
      .ctwp-page img { display:block; width:100%; height:auto; object-fit:contain; }
      .ctwp-print-notice { display:none; }
      @page { size:auto; margin:10mm; }
      @media print {
        html,body { margin:0; padding:0; background:white; }
        .ctwp-toolbar { display:none !important; }
        .ctwp-pages { padding:0; }
        .ctwp-page { display:block; width:100%; max-width:none; margin:0; box-shadow:none;
          break-inside:avoid; page-break-inside:avoid; break-after:page; page-break-after:always; }
        .ctwp-page:last-child { break-after:auto; page-break-after:auto; }
        .ctwp-page img { width:100%; height:auto; max-height:270mm; object-fit:contain; }
        .ctwp-print-blocked .ctwp-pages { display:none !important; }
        .ctwp-print-blocked .ctwp-print-notice { display:block; }
      }
    `);
    doc.head.append(charset, viewport, css);
    doc.title = printTitle;
    const toolbar = make('header', 'ctwp-toolbar');
    const title = make('strong', '', printTitle);
    const printButton = make('button', '', '인쇄'); printButton.type = 'button'; printButton.disabled = true;
    const closeButton = make('button', 'ctwp-close', '닫기'); closeButton.type = 'button';
    const message = make('p', 'ctwp-status', '학습지 잠금 상태를 확인하고 있습니다…');
    message.setAttribute('role', 'status');
    const pages = make('main', 'ctwp-pages');
    const notice = make('p', 'ctwp-print-notice', '미리보기 창의 인쇄 버튼을 눌러 학습지 잠금 상태를 확인한 뒤 인쇄해 주세요.');
    toolbar.append(title, printButton, closeButton, message);
    doc.body.classList.add('ctwp-print-blocked');
    doc.body.append(toolbar, pages, notice);
    closeButton.addEventListener('click', () => {
      if (worksheetPrintSession === session) cancelWorksheetPrint();
    });
    session.beforePrint = () => {
      const permitted = session.ready && session.printPermit && worksheetPrintCurrent(session);
      session.printPermit = false;
      doc.body.classList.toggle('ctwp-print-blocked', !permitted);
    };
    session.afterPrint = () => { session.printPermit = false; doc.body.classList.add('ctwp-print-blocked'); };
    session.onPageHide = () => { if (worksheetPrintSession === session) cancelWorksheetPrint(); };
    preview.addEventListener('beforeprint', session.beforePrint);
    preview.addEventListener('afterprint', session.afterPrint);
    preview.addEventListener('pagehide', session.onPageHide);
    session.closeWatch = setInterval(() => {
      if (worksheetPrintSession === session && !worksheetPrintCurrent(session)) cancelWorksheetPrint();
    }, 500);
    printButton.addEventListener('click', async () => {
      if (!session.ready || printButton.disabled || !worksheetPrintCurrent(session)) return;
      printButton.disabled = true; message.textContent = '인쇄 전 잠금 상태를 확인하고 있습니다…';
      try {
        const allowed = await refreshWorksheetLocks();
        if (!allowed || !worksheetPrintCurrent(session)) {
          if (worksheetPrintSession === session) cancelWorksheetPrint();
          status('잠금 상태가 바뀌었거나 확인할 수 없어 인쇄를 중단했습니다.');
          return;
        }
        message.textContent = '필기와 표시가 포함됩니다. 인쇄 창에서 용지와 방향을 선택해 주세요.';
        session.printPermit = true;
        doc.body.classList.remove('ctwp-print-blocked');
        preview.focus(); preview.print();
      } catch {
        session.printPermit = false;
        if (worksheetPrintSession === session) {
          doc.body.classList.add('ctwp-print-blocked');
          message.textContent = '인쇄를 시작하지 못했습니다. 잠금 상태와 브라우저 설정을 확인한 뒤 다시 눌러 주세요.';
        }
      } finally {
        if (worksheetPrintCurrent(session)) printButton.disabled = false;
      }
    });
    try {
      const allowed = await refreshWorksheetLocks();
      if (!allowed || !worksheetPrintCurrent(session)) throw worksheetPrintCancelled();
      status('필기가 포함된 인쇄 미리보기를 준비하고 있습니다.');
      for (let number = 1; number <= session.documentPDF.numPages; number++) {
        if (!worksheetPrintCurrent(session)) throw worksheetPrintCancelled();
        message.textContent = number + ' / ' + session.documentPDF.numPages + '쪽을 준비하고 있습니다…';
        const page = await session.documentPDF.getPage(number);
        if (!worksheetPrintCurrent(session)) throw worksheetPrintCancelled();
        const original = page.getViewport({scale:1});
        const printViewport = page.getViewport({scale:1600 / Math.max(original.width, original.height)});
        const canvas = document.createElement('canvas');
        canvas.width = Math.ceil(printViewport.width); canvas.height = Math.ceil(printViewport.height);
        session.canvases.add(canvas);
        const context = canvas.getContext('2d');
        if (!context) throw new Error('worksheet-print-canvas');
        context.fillStyle = '#ffffff'; context.fillRect(0, 0, canvas.width, canvas.height);
        session.task = page.render({canvasContext:context, viewport:printViewport});
        await session.task.promise;
        session.task = null;
        if (!worksheetPrintCurrent(session)) throw worksheetPrintCancelled();
        context.setTransform(1, 0, 0, 1, 0, 0);
        paintNotes(context, snapshot[number] || [], printViewport.width, printViewport.height);
        const blob = await worksheetPrintBlob(canvas, session);
        if (!worksheetPrintCurrent(session)) throw worksheetPrintCancelled();
        canvas.width = 0; canvas.height = 0; session.canvases.delete(canvas);
        const url = URL.createObjectURL(blob); session.urls.add(url);
        const pageBox = make('section', 'ctwp-page');
        pageBox.setAttribute('aria-label', number + '쪽');
        const img = make('img'); img.alt = '필기가 포함된 학습지 ' + number + '쪽';
        // Wait for decoding before enabling print; a fast click must not print blank images.
        const imageReady = worksheetPrintLoadImage(img, url, session);
        pageBox.appendChild(img); pages.appendChild(pageBox);
        await imageReady;
        if (!worksheetPrintCurrent(session)) throw worksheetPrintCancelled();
      }
      session.ready = true; printButton.disabled = false;
      message.textContent = '총 ' + session.documentPDF.numPages + '쪽 · 필기와 표시가 포함됩니다. 위의 인쇄 버튼을 눌러 주세요.';
      status('필기 포함 인쇄 미리보기를 열었습니다.');
      preview.focus();
    } catch (error) {
      const isCurrent = worksheetPrintSession === session;
      if (isCurrent) cancelWorksheetPrint();
      if (isCurrent && live()) status(error.name === 'WorksheetPrintCancelled' || error.name === 'RenderingCancelledException'
        ? '학습지 상태가 바뀌었거나 미리보기가 닫혀 인쇄 준비를 중단했습니다.'
        : '인쇄 미리보기를 만들지 못했습니다. 학습지를 다시 연 뒤 시도해 주세요.');
    }
  }
  $('print').addEventListener('click', printWorksheet);

  // CTW_PINCH_ZOOM 2026-09-13.1 — PDF-local gesture, never whole-page zoom.
  // Pointer Events + a predeclared touch-action:none keep ownership from the
  // first contact; changing touch-action after a second finger arrives is too late.
  const worksheetTouches = new Map();
  let touchGesture = null;
  const touchPair = gesture => gesture.ids.map(id => worksheetTouches.get(id));
  const touchDistance = (a,b) => Math.hypot(b.x-a.x,b.y-a.y);
  const touchCenter = (a,b) => ({x:(a.x+b.x)/2,y:(a.y+b.y)/2});
  function releaseWorksheetTouch(id) {
    try { if (view.hasPointerCapture && view.hasPointerCapture(id)) view.releasePointerCapture(id); } catch {}
  }
  function discardTouchStroke() {
    if (touchGesture && touchGesture.drawing && stroke) {
      stroke = null; pointerID = null; drawNotes();
    }
  }
  function cancelTouchInteraction() {
    discardTouchStroke();
    const ids = [...worksheetTouches.keys()];
    worksheetTouches.clear(); touchGesture = null;
    stage.style.transform = ''; stage.style.transformOrigin = '';
    ids.forEach(releaseWorksheetTouch);
  }
  function beginWorksheetPinch() {
    discardTouchStroke(); cancelText(); finishStroke(); rememberScroll();
    const ids = [...worksheetTouches.keys()].slice(0,2), [a,b] = ids.map(id => worksheetTouches.get(id));
    const distance = touchDistance(a,b), center = touchCenter(a,b), rect = stage.getBoundingClientRect();
    if (distance < 2 || rect.width <= 0 || rect.height <= 0) { touchGesture = {mode:'blocked'}; return; }
    clearTimeout(resizeTimer); ++renderVersion;
    if (renderTask) renderTask.cancel();
    touchGesture = {mode:'pinch',ids,distance,startZoom:zoom,width:pageWidth,height:pageHeight,
      left:rect.left,top:rect.top,center,
      anchorX:clamp((center.x-rect.left)/rect.width,0,1),anchorY:clamp((center.y-rect.top)/rect.height,0,1)};
    rendering = true; controls();
    stage.style.transformOrigin = '0 0';
  }
  function moveWorksheetPinch() {
    const gesture = touchGesture;
    if (!gesture || gesture.mode !== 'pinch') return;
    const [a,b] = touchPair(gesture); if (!a || !b) return;
    const distance = touchDistance(a,b), center = touchCenter(a,b);
    zoom = clamp(Math.round(gesture.startZoom * distance / gesture.distance * 100),100,200) / 100;
    gesture.center = center;
    const ratio = zoom / gesture.startZoom;
    const x = center.x - gesture.left - gesture.anchorX * gesture.width * ratio;
    const y = center.y - gesture.top - gesture.anchorY * gesture.height * ratio;
    // Fast raster preview while moving. PDF.js rerenders once the fingers lift.
    stage.style.transform = `translate(${x}px, ${y}px) scale(${ratio})`;
    syncZoomControl(); showZoom();
  }
  function finishWorksheetPinch() {
    const gesture = touchGesture;
    if (!gesture || gesture.mode !== 'pinch') return;
    pendingZoomAnchor = {page:pageNumber,x:gesture.anchorX,y:gesture.anchorY,
      clientX:gesture.center.x,clientY:gesture.center.y};
    touchGesture = {mode:'blocked'};
    // Keep the visual preview until renderPage commits the new canvas geometry.
    persist(); renderPage();
  }
  function worksheetTouchDown(event) {
    if (event.pointerType !== 'touch') return;
    if (!worksheetAllowed() || !open || !pdf || loading || stage.hidden) return;
    // Interactive status/retry elements must retain their native click handling.
    if (event.target.closest && event.target.closest('button,input,select,textarea,a')) return;
    event.preventDefault(); event.stopPropagation();
    if (rendering && (!touchGesture || touchGesture.mode !== 'pinch')) return;
    worksheetTouches.set(event.pointerId,{x:event.clientX,y:event.clientY});
    try { view.setPointerCapture(event.pointerId); } catch {}
    if (worksheetTouches.size >= 2) {
      if (!touchGesture || touchGesture.mode === 'single') beginWorksheetPinch();
      return;
    }
    const rect = ink.getBoundingClientRect();
    const onPaper = event.clientX >= rect.left && event.clientX <= rect.right && event.clientY >= rect.top && event.clientY <= rect.bottom;
    touchGesture = {mode:'single',id:event.pointerId,x:event.clientX,y:event.clientY,
      left:view.scrollLeft,top:view.scrollTop,moved:0,tool,onPaper,drawing:false,at:pointAt(event)};
    if (onPaper && (tool === 'pen' || tool === 'highlight')) {
      finishStroke(); pointerID = event.pointerId;
      stroke = {kind:tool,color:$('color').value,size:tool === 'highlight' ? .027 : .004,points:[touchGesture.at]};
      touchGesture.drawing = true; drawNotes();
    }
    // Text waits for a one-finger tap to end; adding a second finger never opens an editor.
  }
  function worksheetTouchMove(event) {
    if (event.pointerType !== 'touch' || !worksheetTouches.has(event.pointerId)) return;
    event.preventDefault(); event.stopPropagation();
    if (!worksheetAllowed() || !pdf || !open) { cancelTouchInteraction(); return; }
    worksheetTouches.set(event.pointerId,{x:event.clientX,y:event.clientY});
    if (!touchGesture) return;
    if (touchGesture.mode === 'pinch') { moveWorksheetPinch(); return; }
    if (touchGesture.mode !== 'single' || touchGesture.id !== event.pointerId) return;
    touchGesture.moved = Math.max(touchGesture.moved,Math.hypot(event.clientX-touchGesture.x,event.clientY-touchGesture.y));
    if (touchGesture.tool === 'move' || !touchGesture.onPaper) {
      view.scrollLeft = touchGesture.left + touchGesture.x - event.clientX;
      view.scrollTop = touchGesture.top + touchGesture.y - event.clientY;
    } else if (touchGesture.drawing && stroke && stroke.points.length < 4000) {
      stroke.points.push(pointAt(event)); drawNotes();
    }
  }
  function worksheetTouchEnd(event) {
    if (event.pointerType !== 'touch' || !worksheetTouches.has(event.pointerId)) return;
    event.preventDefault(); event.stopPropagation();
    const gesture = touchGesture, cancelled = event.type !== 'pointerup';
    if (gesture && gesture.mode === 'pinch' && gesture.ids.includes(event.pointerId)) finishWorksheetPinch();
    else if (gesture && gesture.mode === 'single' && gesture.id === event.pointerId) {
      if (cancelled) discardTouchStroke();
      else if (gesture.drawing) finishStroke();
      else if (gesture.onPaper && gesture.tool === 'text' && gesture.moved < 10 && worksheetAllowed()) {
        textPosition = gesture.at; $('text-form').hidden = false; drawNotes(); $('text').focus({preventScroll:true});
      }
      rememberScroll();
    }
    worksheetTouches.delete(event.pointerId); releaseWorksheetTouch(event.pointerId);
    if (!worksheetTouches.size) touchGesture = null;
    // Any finger remaining after a pinch stays blocked until every finger lifts.
  }
  view.addEventListener('pointerdown',worksheetTouchDown,{capture:true,passive:false});
  view.addEventListener('pointermove',worksheetTouchMove,{capture:true,passive:false});
  for (const name of ['pointerup','pointercancel','lostpointercapture']) view.addEventListener(name,worksheetTouchEnd,{capture:true,passive:false});
  function cleanupWorksheetTouch() {
    cancelTouchInteraction();
    view.removeEventListener('pointerdown',worksheetTouchDown,true);
    view.removeEventListener('pointermove',worksheetTouchMove,true);
    for (const name of ['pointerup','pointercancel','lostpointercapture']) view.removeEventListener(name,worksheetTouchEnd,true);
  }

  dimensions(); updateWorksheetLockUI();
  if (new URLSearchParams(location.search).get('worksheet') === '1') setOpen(true);
  else refreshWorksheetLocks();
})();
</script></body></html>
